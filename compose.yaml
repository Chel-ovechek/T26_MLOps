services:
  app:
    build:
      context: .
      target: runtime
    image: mlops-flight-delay:${IMAGE_TAG:-lr6-local}
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      MODEL_PATH: /app/models/model.joblib
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-team1"
version = "0.1.0"
description = "Учебный проект команды 1 по курсу MLOps (ЛР1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
tracking = [
    "mlflow>=3.16,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

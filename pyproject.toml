
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-team1"
version = "0.1.0"
description = "Учебный проект команды 1 по курсу MLOps (ЛР1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "fastapi>=0.115,<1",
    "prometheus-client>=0.26,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "httpx>=0.28,<1",
]
tracking = [
    "mlflow>=3.16,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: данные и контракт",
    "evaluation: метрики, пороги и цель",
    "model: артефакт модели (bundle) и обучение",
    "api: интерфейс предсказания (HTTP API и функции model_io)",
    "pipeline: связка компонентов и метаданные запуска",
    "project: служебные проверки пакета и тестовой инфраструктуры",
]
